name: Cloud
# Tests mobdev.sh and deploys it on every push to main. The relay worker is only redeployed when
# its code changed since the last successful deploy (or on a manual run), because a deploy
# briefly disconnects every Mac (they reconnect on their own).
on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  pull_request:
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: cloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Did the relay change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Compares with the last push to main that deployed successfully, not the previous push,
        # so relay changes of a failed or cancelled run go out with the next one. Runs are
        # serialized (concurrency above), so no other deploy is under way. Manual runs, and runs
        # without a usable base commit, deploy the relay.
        run: |
          BASE=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE=$(gh run list --workflow cloud.yml --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""') || BASE=""
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "relay=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^cloud/(relay/|shared/|migrations/|package.json|bun.lock)'; then
            echo "relay=true" >> "$GITHUB_OUTPUT"
          else
            echo "relay=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply database migrations
        run: bunx wrangler d1 migrations apply mobdev --remote
      - name: Deploy relay.mobdev.sh
        if: steps.changes.outputs.relay == 'true'
        run: bun run deploy:relay
      - name: Deploy mobdev.sh
        run: bun run deploy:web
      - name: Smoke test
        run: |
          curl -fsS https://relay.mobdev.sh/healthz
          curl -fsS -o /dev/null https://mobdev.sh/
