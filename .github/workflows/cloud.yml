name: Cloud
# Tests mobdev.sh and deploys it on every push to main. The relay worker is only redeployed when
# its code changes, because a deploy briefly disconnects every Mac (they reconnect on their own).
on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  pull_request:
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: cloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Did the relay change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "relay=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -qE '^cloud/(relay/|shared/|migrations/|package.json|bun.lock)'; then
            echo "relay=true" >> "$GITHUB_OUTPUT"
          else
            echo "relay=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply database migrations
        run: bunx wrangler d1 migrations apply mobdev --remote
      - name: Deploy relay.mobdev.sh
        if: steps.changes.outputs.relay == 'true'
        run: bun run deploy:relay
      - name: Deploy mobdev.sh
        run: bun run deploy:web
      - name: Smoke test
        run: |
          curl -fsS https://relay.mobdev.sh/healthz
          curl -fsS -o /dev/null https://mobdev.sh/
