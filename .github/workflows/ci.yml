name: Native app and relay
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
        working-directory: relay
      - run: go test -race ./...
        working-directory: relay

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  macos:
    # Needs Xcode 26 or later (Swift 6.2, macOS 26 SDK for Liquid Glass).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: swift test
        working-directory: macos
      - run: scripts/build-app.sh
        working-directory: macos
      - uses: actions/upload-artifact@v4
        with:
          name: Mobdev.app
          path: macos/build/Mobdev.app
          if-no-files-found: error
