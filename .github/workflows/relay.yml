name: Relay
# Tests the self-hosted relay and publishes its Docker image (amd64 + arm64) to GHCR on main:
#   docker run -p 8080:8080 ghcr.io/niklas-schmidt-dev/mobdev-relay
# Runs on main never overlap, so :latest is always the newest commit's image; every image is
# also tagged with its commit SHA.
on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: relay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mobdev-relay:latest
            ghcr.io/${{ github.repository_owner }}/mobdev-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
