name: Flows
# Runs the example flow in examples/flows and the example tests in examples/tests on an iOS
# simulator on a GitHub-hosted Mac, the way the README tells people to run them in CI, and the
# example tests once more through the GitHub Action in actions/test. Changes to the app or the
# action run them with Mobdev built from that commit; after every Mac release they run again with
# the released app from the DMG.
on:
  push:
    branches: [main]
    paths: ["macos/**", "examples/**", "actions/**", ".github/workflows/flows.yml"]
  pull_request:
    paths: ["macos/**", "examples/**", "actions/**", ".github/workflows/flows.yml"]
  workflow_run:
    workflows: ["Mac app"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Run with this released version's DMG (e.g. 0.2.27) instead of building from source"
        required: false

permissions:
  contents: read

concurrency:
  group: flows-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  flow:
    # After "Mac app", only when it ran for a push to main and succeeded, so a release exists.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Get Mobdev
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            curl -fsSL -o Mobdev.dmg "https://github.com/$GITHUB_REPOSITORY/releases/download/mac-v$VERSION/Mobdev.dmg"
            hdiutil attach -nobrowse -mountpoint /tmp/mobdev Mobdev.dmg
            echo "MOBDEV=/tmp/mobdev/Mobdev.app/Contents/MacOS/Mobdev" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            curl -fsSL -o Mobdev.dmg "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Mobdev.dmg"
            hdiutil attach -nobrowse -mountpoint /tmp/mobdev Mobdev.dmg
            echo "MOBDEV=/tmp/mobdev/Mobdev.app/Contents/MacOS/Mobdev" >> "$GITHUB_ENV"
          else
            swift build --package-path macos --product Mobdev
            echo "MOBDEV=$PWD/macos/.build/debug/Mobdev" >> "$GITHUB_ENV"
          fi
      - name: Boot a simulator
        run: |
          # The first iPhone of the newest iOS runtime on the image.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries | map(select(.key | test("iOS"))) | sort_by(.key) | last
            | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build the example app
        run: examples/flows/fixture/build.sh
      - name: Run the flow
        working-directory: examples/flows
        run: '"$MOBDEV" flow smoke.json --device "$UDID" --artifacts "$RUNNER_TEMP/flow-artifacts"'
      - name: Run the tests
        if: always()
        run: '"$MOBDEV" test examples/tests --device "$UDID" --artifacts "$RUNNER_TEMP/test-artifacts"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-artifacts
          path: |
            ${{ runner.temp }}/flow-artifacts
            ${{ runner.temp }}/test-artifacts

  action:
    # The GitHub Action in actions/test, run the way other repositories use it, on the example
    # tests: with Mobdev built from this commit, or with the released DMG after a release.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build Mobdev
        # Without a binary the action downloads the release named by version.
        if: github.event_name != 'workflow_run' && inputs.version == ''
        run: |
          swift build --package-path macos --product Mobdev
          echo "MOBDEV=$PWD/macos/.build/debug/Mobdev" >> "$GITHUB_ENV"
      - name: Build the example app
        run: examples/flows/fixture/build.sh
      - name: Run the example tests with the action
        id: mobdev
        uses: ./actions/test
        with:
          project: examples/tests
          app: examples/flows/fixture/MobdevFixture.app
          mobdev: ${{ env.MOBDEV }}
          version: ${{ inputs.version || 'latest' }}
          artifact-name: action-artifacts
      - name: Check the outputs
        if: always() && steps.mobdev.outcome != 'skipped'
        env:
          PASSED: ${{ steps.mobdev.outputs.passed }}
          RESULTS: ${{ steps.mobdev.outputs.results }}
        run: |
          echo "passed=$PASSED results=$RESULTS"
          test "$PASSED" = true
          test -s "$RESULTS/summary.md"
          test -s "$RESULTS/junit.xml"
