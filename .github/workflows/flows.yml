name: Flows
# Runs the example flow in examples/flows on an iOS simulator on a GitHub-hosted Mac, the way the
# README tells people to run flows in CI. Changes to the app run it with Mobdev built from that
# commit; after every Mac release it runs again with the released app from the DMG.
on:
  push:
    branches: [main]
    paths: ["macos/**", "examples/flows/**", ".github/workflows/flows.yml"]
  pull_request:
    paths: ["macos/**", "examples/flows/**", ".github/workflows/flows.yml"]
  workflow_run:
    workflows: ["Mac app"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flow:
    # After "Mac app", only when it ran for a push to main and succeeded, so a release exists.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Get Mobdev
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            curl -fsSL -o Mobdev.dmg "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Mobdev.dmg"
            hdiutil attach -nobrowse -mountpoint /tmp/mobdev Mobdev.dmg
            echo "MOBDEV=/tmp/mobdev/Mobdev.app/Contents/MacOS/Mobdev" >> "$GITHUB_ENV"
          else
            swift build --package-path macos --product Mobdev
            echo "MOBDEV=$PWD/macos/.build/debug/Mobdev" >> "$GITHUB_ENV"
          fi
      - name: Boot a simulator
        run: |
          # The first iPhone of the newest iOS runtime on the image.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries | map(select(.key | test("iOS"))) | sort_by(.key) | last
            | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Diagnose simulators (temporary)
        run: |
          cat > "$RUNNER_TEMP/probe.swift" <<'EOF'
          import Foundation
          import ObjectiveC
          // Each step Mobdev's SimulatorKit takes, printed, to see where Xcode 26 differs.
          let select = Process()
          select.executableURL = URL(fileURLWithPath: "/usr/bin/xcode-select")
          select.arguments = ["-p"]
          let pipe = Pipe()
          select.standardOutput = pipe
          try! select.run()
          select.waitUntilExit()
          let developer = String(decoding: pipe.fileHandleForReading.readDataToEndOfFile(), as: UTF8.self)
            .trimmingCharacters(in: .whitespacesAndNewlines)
          print("developer dir:", developer)
          let kit = URL(fileURLWithPath: developer).deletingLastPathComponent()
            .appendingPathComponent("SharedFrameworks/SimulatorKit.framework/SimulatorKit").path
          for path in ["/Library/Developer/PrivateFrameworks/CoreSimulator.framework/CoreSimulator", kit] {
            print("dlopen", path, dlopen(path, RTLD_NOW) != nil ? "ok" : String(cString: dlerror()))
          }
          for name in ["IndigoHIDMessageForMouseNSEvent", "IndigoHIDMessageForKeyboardArbitrary", "IndigoHIDMessageForButton"] {
            print("symbol", name, dlsym(UnsafeMutableRawPointer(bitPattern: -2), name) != nil)
          }
          for name in ["SimServiceContext", "_TtC12SimulatorKit24SimDeviceLegacyHIDClient", "AXPTranslator"] {
            print("class", name, NSClassFromString(name) != nil)
          }
          typealias ContextFn = @convention(c) (AnyClass, Selector, NSString, AutoreleasingUnsafeMutablePointer<NSError?>) -> AnyObject?
          let contextClass: AnyClass = NSClassFromString("SimServiceContext")!
          let contextSelector = NSSelectorFromString("sharedServiceContextForDeveloperDir:error:")
          var error: NSError?
          let context = unsafeBitCast(method_getImplementation(class_getClassMethod(contextClass, contextSelector)!), to: ContextFn.self)(
            contextClass, contextSelector, developer as NSString, &error)
          print("context", context != nil, error ?? "")
          typealias SetFn = @convention(c) (AnyObject, Selector, AutoreleasingUnsafeMutablePointer<NSError?>) -> AnyObject?
          let setSelector = NSSelectorFromString("defaultDeviceSetWithError:")
          let set = unsafeBitCast(class_getMethodImplementation(object_getClass(context!), setSelector)!, to: SetFn.self)(
            context!, setSelector, &error) as? NSObject
          print("device set", set != nil, error ?? "")
          for device in (set?.value(forKey: "devices") as? [NSObject]) ?? [] {
            let state = (device.value(forKey: "state") as? NSNumber)?.intValue ?? -1
            guard state == 3 else { continue }
            let runtime = (device.value(forKey: "runtime") as? NSObject)?.value(forKey: "name") ?? "?"
            print("booted:", device.value(forKey: "name") ?? "?", runtime, device.value(forKey: "UDID") ?? "?")
          }
          EOF
          swift "$RUNNER_TEMP/probe.swift" || true
          XCODE=$(xcode-select -p)/..
          ls -la "$XCODE/SharedFrameworks/SimulatorKit.framework" || true
          find "$XCODE" /Library/Developer/PrivateFrameworks -maxdepth 6 -name "SimulatorKit*" 2>/dev/null | head -20
      - name: Video tests (temporary)
        run: |
          cd macos
          # The test step of the Mac app workflow hung on these runners; run only the video tests, briefly.
          perl -e 'alarm 240; exec @ARGV' swift test --filter VideoTests 2>&1 | grep -E "✔|✘|Test run|error|hang" || true
          echo "exit ${PIPESTATUS[0]}"
      - name: Build the example app
        run: examples/flows/fixture/build.sh
      - name: Run the flow
        working-directory: examples/flows
        run: '"$MOBDEV" flow smoke.json --device "$UDID" --artifacts "$RUNNER_TEMP/flow-artifacts"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-artifacts
          path: ${{ runner.temp }}/flow-artifacts
